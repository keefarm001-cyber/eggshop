<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egg Station</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Sarabun',sans-serif;background:#f4f6f9;color:#1f2937}
#loginPage{display:flex;height:100vh;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:12px;padding:32px;width:360px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.login-box h1{font-size:22px;font-weight:700;color:#e67e00;margin-bottom:4px;text-align:center}
.login-box p{font-size:13px;color:#6b7280;text-align:center;margin-bottom:24px}
.ctrl{width:100%;border:1.5px solid #d1d5db;border-radius:8px;padding:10px 13px;font-size:14px;font-family:'Sarabun',sans-serif;outline:none;margin-bottom:12px}
.ctrl:focus{border-color:#e67e00}
.btn{width:100%;padding:12px;background:#e67e00;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif}
.btn:hover{background:#d97706}
.err{color:#dc2626;font-size:12px;margin-top:8px;display:none}
.err.show{display:block}
#appPage{display:none;position:fixed;inset:0;overflow:hidden}
#appPage.active{display:flex;flex-direction:row}
#sidebar{width:220px;min-width:220px;background:#fff;border-right:1px solid #d1d5db;display:flex;flex-direction:column;overflow-y:auto;box-shadow:1px 0 4px rgba(0,0,0,.05)}
.main-content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.nav-brand{padding:16px;font-size:16px;font-weight:700;color:#e67e00;border-bottom:1px solid #f3f4f6}
.nav-section{padding:6px 14px 2px;font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-top:8px}
.nav-link{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;color:#374151;cursor:pointer;border-left:3px solid transparent;user-select:none}
.nav-link:hover{background:#f9fafb;color:#e67e00}
.nav-link.active{background:#fff7ed;color:#e67e00;border-left-color:#e67e00;font-weight:600}
.nav-user{margin-top:auto;padding:12px 14px;border-top:1px solid #f3f4f6;font-size:12px;color:#6b7280}
.nav-user-name{font-weight:600;color:#1f2937;margin-bottom:2px}
.btn-logout{background:none;border:1px solid #d1d5db;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;color:#6b7280;margin-top:6px;font-family:'Sarabun',sans-serif}
.btn-logout:hover{background:#fef2f2;color:#dc2626;border-color:#fca5a5}
.page{display:none;flex-direction:column;flex:1;overflow:hidden}
.page.active{display:flex}
.ph{padding:16px 22px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#fff}
.pt{font-size:18px;font-weight:700}
.pb{flex:1;padding:18px 22px;overflow-y:auto}
.card{background:#fff;border-radius:10px;padding:16px;border:1px solid #e5e7eb;margin-bottom:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mt{font-size:16px;font-weight:700}
.mc{background:none;border:none;font-size:18px;cursor:pointer;color:#6b7280}
.lbl{font-size:12px;font-weight:600;color:#6b7280}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;border:none;cursor:pointer;font-family:'Sarabun',sans-serif}
.btn-primary{background:#e67e00;color:#fff}.btn-secondary{background:#f0f2f5;color:#374151}
.btn-danger{background:#fee2e2;color:#dc2626}.btn-success{background:#e8faf0;color:#16a34a}
.btn-info{background:#eff6ff;color:#2563eb}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sc{background:#fff;border-radius:10px;padding:14px;border:1px solid #e5e7eb}
.sl{font-size:11px;color:#6b7280;margin-bottom:4px}
.sv{font-size:22px;font-weight:700;color:#e67e00}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bs{background:#e8faf0;color:#16a34a}.be{background:#fee2e2;color:#dc2626}
.bw{background:#fffbeb;color:#d97706}.bg{background:#f0f2f5;color:#6b7280}
.bi{background:#eff6ff;color:#2563eb}
table{width:100%;border-collapse:collapse}
th{padding:9px 12px;text-align:left;font-size:12px;color:#6b7280;border-bottom:1px solid #e5e7eb;background:#f9fafb;font-weight:600}
td{padding:9px 12px;font-size:13px;border-bottom:1px solid #f3f4f6}
tr:hover td{background:#fafafa}
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#9ca3af}
.ei{font-size:48px;margin-bottom:8px}
input[type=number]::-webkit-inner-spin-button{opacity:1}
select.ctrl,input.ctrl,textarea.ctrl{display:block;margin-top:0}
.ct{font-size:13px;font-weight:700;color:#374151;margin-bottom:12px}
</style>
</head>
<body>

<div id="loginPage">
  <div class="login-box">
    <h1>🥚 Egg Station</h1>
    <p>ระบบจัดการร้านไข่</p>
    <input class="ctrl" type="text" id="loginUser" placeholder="Username" autocomplete="username">
    <input class="ctrl" type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="err" id="loginError"></div>
  </div>
</div>

<div id="appPage">
  <div id="sidebar">
    <div class="nav-brand">🥚 Egg Station</div>
    <div id="navBranchLabel" style="padding:6px 14px;font-size:11px;color:#9ca3af;background:#f9fafb;border-bottom:1px solid #f3f4f6"></div>
    <div id="navLinks"></div>
    <div class="nav-user">
      <div class="nav-user-name" id="navUserName"></div>
      <div id="navUserRole" style="font-size:11px;color:#9ca3af"></div>
      <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
    </div>
  </div>
  <div class="main-content" id="mainContent">
    <div class="page active" id="page-dashboard">
      <div class="ph"><div class="pt">📊 กำลังโหลด...</div></div>
      <div class="pb"><div class="es"><div class="ei">⏳</div><p>กำลังเชื่อมต่อระบบ</p></div></div>
    </div>
  </div>
</div>
<div id="MC"></div>

<script>

let CU=null, branches=[], roles=[];

const api = {
  tok: () => localStorage.getItem('es_token'),
  async r(method, path, body) {
    const opts = {method, headers:{'Content-Type':'application/json','Authorization':'Bearer '+api.tok()}};
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch('/api'+path, opts);
    if (res.status===401) { logout(); return null; }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error||'เกิดข้อผิดพลาด');
    return data;
  },
  get: (path) => api.r('GET', path),
  post: (path, body) => api.r('POST', path, body),
  put: (path, body) => api.r('PUT', path, body),
  del: (path) => api.r('DELETE', path),
};

const fmt = {
  b: (n) => '฿'+(parseFloat(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2}),
  n: (n) => (parseInt(n)||0).toLocaleString('th-TH'),
  d: (s) => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-',
  dn: (s) => s||'-',
  role: (r) => ({owner:'เจ้าของ',admin:'ผู้ดูแล',manager:'ผู้จัดการ',cashier:'แคชเชียร์',stock:'สต๊อก',viewer:'ผู้ชม',accountant:'บัญชี',sales_pc:'พนักงานขาย'}[r]||r),
  badge: (s) => {
    const m = {paid:'<span class="badge bs">ชำระแล้ว</span>',unpaid:'<span class="badge be">ค้างชำระ</span>',partial:'<span class="badge bw">ชำระบางส่วน</span>',draft:'<span class="badge bg">ร่าง</span>',approved:'<span class="badge bs">อนุมัติ</span>',pre:'<span class="badge bw">รอใส่ราคา</span>'};
    return m[s]||`<span class="badge bg">${s}</span>`;
  }
};

function CM() { document.getElementById('MC').innerHTML=''; }
function toast(msg, type='success') {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:14px;z-index:9999;color:#fff;background:${type==='error'?'#dc2626':type==='info'?'#2563eb':'#16a34a'};box-shadow:0 4px 12px rgba(0,0,0,.15)`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

// ============================================================
// NAV CONFIG
// ============================================================
const NAV_CONFIG = [
  {sec:'การขาย'},
  {id:'pos',l:'ขายหน้าร้าน',i:'🛒',r:['owner','admin','manager','cashier']},
  {id:'shifts',l:'กะการขาย',i:'⏰',r:['owner','admin','manager','cashier']},
  {id:'sales',l:'ประวัติการขาย',i:'📑',r:['owner','admin','manager']},
  {id:'daily-close',l:'ปิดยอดประจำวัน',i:'📋',r:['owner','admin','manager','cashier']},
  {sec:'เอกสาร'},
  {id:'quotations',l:'ใบเสนอราคา',i:'📝',r:['owner','admin','manager']},
  {id:'invoices',l:'ใบแจ้งหนี้',i:'📄',r:['owner','admin','manager']},
  {id:'credits',l:'ลูกค้าเชื่อ',i:'💳',r:['owner','admin','manager']},
  {id:'receipts',l:'ใบรับสินค้า',i:'📦',r:['owner','admin','manager','stock']},
  {sec:'สต๊อก'},
  {id:'stock',l:'สต๊อกสินค้า',i:'🥚',r:['owner','admin','manager','stock']},
  {id:'smv',l:'ประวัติสต๊อก',i:'📜',r:['owner','admin','manager']},
  {sec:'CRM'},
  {id:'members',l:'สมาชิก',i:'⭐',r:['owner','admin','manager','cashier']},
  {id:'contacts',l:'ผู้ติดต่อ',i:'👥',r:['owner','admin','manager']},
  {sec:'จัดการ'},
  {id:'products',l:'สินค้า',i:'🥚',r:['owner','admin','manager']},
  {id:'reports',l:'รายงาน',i:'📈',r:['owner','admin','manager']},
  {id:'users',l:'ผู้ใช้งาน',i:'⚙️',r:['owner','admin']},
  {id:'permissions',l:'ตั้งค่าสิทธิ์',i:'🔐',r:['owner','admin']},
  {id:'company',l:'ตั้งค่าบริษัท',i:'🏢',r:['owner','admin']},
  {sec:'HR'},
  {id:'employees',l:'พนักงาน',i:'👔',r:['owner','admin']},
  {sec:'การเงิน'},
  {id:'expenses',l:'ค่าใช้จ่าย',i:'💰',r:['owner','admin','manager']},
  {id:'promotions',l:'โปรโมชั่น',i:'🎁',r:['owner','admin','manager']},
  {id:'debt-notes',l:'ใบลดหนี้/เพิ่มหนี้',i:'📋',r:['owner','admin','manager']},
  {id:'expense-docs',l:'ค่าใช้จ่าย (เอกสาร)',i:'🧾',r:['owner','admin','manager']},
  {id:'payroll',l:'เงินเดือน/Payroll',i:'💵',r:['owner','admin']},
];

function buildNav() {
  const nl = document.getElementById('navLinks');
  nl.innerHTML = '';
  NAV_CONFIG.forEach(item => {
    if (item.sec) {
      const s = document.createElement('div');
      s.className = 'nav-section';
      s.textContent = item.sec;
      nl.appendChild(s);
    } else if (!item.r || item.r.includes(CU.role)) {
      const a = document.createElement('div');
      a.className = 'nav-link';
      a.id = 'nav-'+item.id;
      a.innerHTML = `<span>${item.i}</span><span>${item.l}</span>`;
      a.onclick = () => showPage(item.id);
      nl.appendChild(a);
    }
  });
}

// ============================================================
// PAGE SYSTEM
// ============================================================
const PAGE_LOADERS = {};

function showPage(id) {
  // ซ่อนทุกหน้า
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  // หรือสร้างหน้าใหม่ถ้ายังไม่มี
  let page = document.getElementById('page-'+id);
  if (!page) {
    page = createPage(id);
  }
  if (page) page.classList.add('active');
  const nl = document.getElementById('nav-'+id);
  if (nl) nl.classList.add('active');
  // เรียก loader
  if (PAGE_LOADERS[id]) {
    try { PAGE_LOADERS[id](); } catch(e) { console.error('loader error', id, e); }
  }
}

function createPage(id) {
  const mc = document.getElementById('mainContent');
  const page = document.createElement('div');
  page.className = 'page';
  page.id = 'page-'+id;
  page.innerHTML = `<div class="ph"><div class="pt">${id}</div></div><div class="pb"><div class="es"><div class="ei">⏳</div><p>กำลังโหลด...</p></div></div>`;
  mc.appendChild(page);
  return page;
}

// ============================================================
// AUTH
// ============================================================
async function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.classList.remove('show');
  if (!user||!pass) { err.textContent='กรุณากรอก username และ password'; err.classList.add('show'); return; }
  btn.disabled=true; btn.textContent='กำลังเข้าสู่ระบบ...';
  try {
    const data = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
    const res = await data.json();
    if (!data.ok) throw new Error(res.error||'เข้าสู่ระบบไม่ได้');
    localStorage.setItem('es_token', res.token);
    localStorage.setItem('es_user', JSON.stringify(res.user));
    CU = res.user;
    initApp();
    // เลือกสาขาถ้าจำเป็น
    if (res.user.access_branches && res.user.access_branches.length > 1 && !['owner','admin'].includes(CU.role)) {
      showBranchSelector(res.user.access_branches);
    }
  } catch(e) {
    err.textContent = e.message;
    err.classList.add('show');
    btn.disabled=false; btn.textContent='เข้าสู่ระบบ';
  }
}

function logout() {
  localStorage.removeItem('es_token');
  localStorage.removeItem('es_user');
  CU = null;
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('appPage').classList.remove('active');
}

async function initApp() {
  document.getElementById('loginPage').style.display='none';
  document.getElementById('appPage').classList.add('active');
  document.getElementById('navUserName').textContent = CU.full_name||CU.username;
  document.getElementById('navUserRole').textContent = fmt.role(CU.role);
  document.getElementById('navBranchLabel').textContent = CU.branch_code||CU.branch_name||'';
  buildNav();
  // โหลด branches
  try { branches = await api.get('/branches'); } catch(e) {}
  // ไปหน้าหลัก
  const defaultPage = {owner:'dashboard',admin:'dashboard',manager:'dashboard',cashier:'pos',stock:'stock',viewer:'reports'}[CU.role]||'dashboard';
  showPage(defaultPage);
}

function showBranchSelector(list) {
  document.getElementById('MC').innerHTML = `<div class="modal-overlay"><div class="modal"><div class="mh"><div class="mt">🏪 เลือกสาขาที่ทำงานวันนี้</div></div>
  <div style="display:grid;gap:8px">${list.map(b=>`<button class="btn btn-secondary" style="padding:14px;font-size:15px" onclick="switchBranch(${b.id},'${b.code}','${b.name}')">${b.name}</button>`).join('')}</div>
  </div></div>`;
}

async function switchBranch(bid, bcode, bname) {
  try {
    const res = await api.post('/auth/switch-branch', {branch_id:bid});
    localStorage.setItem('es_token', res.token);
    CU = {...CU, branch_id:res.branch_id, branch_code:res.branch_code, branch_name:res.branch_name};
    localStorage.setItem('es_user', JSON.stringify(CU));
    document.getElementById('navBranchLabel').textContent = bname;
    CM();
    showPage('dashboard');
    toast('เปลี่ยนสาขา: '+bname);
  } catch(e) { toast(e.message,'error'); }
}

// ============================================================
// AUTO LOGIN
// ============================================================
document.addEventListener('keydown', e => { if(e.key==='Enter' && document.getElementById('loginPage').style.display!=='none') doLogin(); });

const _t = localStorage.getItem('es_token'), _u = localStorage.getItem('es_user');
if (_t && _u) { try { CU=JSON.parse(_u); initApp(); } catch(e) { localStorage.clear(); } }
</script>
</body>
</html>
